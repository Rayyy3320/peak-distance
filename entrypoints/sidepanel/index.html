<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./style.css" />
    <title>Peak Distance</title>
  </head>
  <body inert>
    <header class="app-header">
      <div class="brand-row"><div class="brand-name">Peak Distance<small>让世界的知识，走向你。</small></div>
        <button id="panel-mode" title="切换面板模式" aria-label="切换为浮动面板">浮动</button><button id="open-settings" title="设置" aria-label="设置">⚙</button><button id="panel-close" aria-label="关闭面板">×</button></div>
      <nav id="views" aria-label="主导航"><button data-view="subs" type="button">当前内容</button><button data-view="list" class="active" type="button">生词本</button><button data-view="chat" type="button">AI 问答</button></nav>
      <div class="brand-landscape" aria-hidden="true"></div>
    </header>
    <div class="app-content">
      <div id="panel-feedback" role="status" hidden></div>
      <div id="library-tools"><div class="section-title"><h1>生词本</h1><button data-view="review" type="button">原句复习 →</button></div><div class="library-tabs"><button data-view="list">词语</button><button data-view="sentences">句子</button></div><input id="search" type="search" placeholder="搜索表达…" autocomplete="off" aria-label="搜索表达"><select id="lang-filter" aria-label="语言筛选"><option value="all">全部语言</option><option value="und">待确认</option></select></div>
    <main id="view-list" aria-live="polite">
      <div id="list"></div>
    </main>

    <main id="view-sentences" hidden><div id="sentences-list"></div></main>

    <main id="view-subs" hidden>
      <div id="subs-head"></div>
      <div id="subs-ctrl"></div>
      <div id="video-workspace"></div><div id="web-selection"></div>
    </main>

    <main id="view-review" hidden>
      <div id="review-body"></div>
    </main>

    <main id="view-chat" hidden>
      <div id="chat-head"></div>
      <div id="chat-segments"></div>
      <div id="chat-cite-panel" hidden></div>
      <div id="chat-list"></div>
      <button id="chat-latest" type="button" hidden>↓ 回到最新</button>
      <div id="chat-input-row">
        <div id="chat-starters"></div>
        <textarea
          id="chat-input"
          rows="3"
          aria-label="向 AI 提问"
          placeholder="想弄懂什么？"
        ></textarea>
        <div class="chat-composer-tools">
          <details id="chat-attachments">
            <summary><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>附加材料</summary>
            <div class="chat-attachment-menu">
              <button id="chat-attach-page" class="chat-tool">附加页面</button>
              <button id="chat-attach-selection" class="chat-tool">附加选区</button>
              <button id="chat-attach-video" class="chat-tool">附加视频字幕</button>
            </div>
          </details>
          <button id="chat-settings" class="chat-tool">AI 设置</button>
          <button id="chat-send" type="button" aria-label="发送" title="发送（Ctrl+Enter）"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M4 10l6-6 6 6"/></svg></button>
          <button id="chat-stop" type="button" hidden>停止</button>
        </div>
        <div id="chat-input-meta">
          <span id="chat-meta-error" role="status" hidden></span>
          <span id="chat-count"></span>
        </div>
      </div>
    </main>

    <main id="view-settings" hidden><div class="settings-heading"><button id="settings-back" aria-label="返回" title="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button><h1>设置</h1></div><div id="settings-body"></div></main>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
